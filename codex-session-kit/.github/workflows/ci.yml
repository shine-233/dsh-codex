name: ci
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        env:
          NODE_OPTIONS: "--experimental-sqlite"
      - run: npx tsc --noEmit
      - run: npx vitest run
