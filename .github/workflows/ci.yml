name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - codex-config-importer
          - codex-edit-fusion
          - codex-net-guard
          - codex-policy-engine
          - codex-prompts
          - codex-schema
          - codex-session-kit
          - codex-skills-kit
          - codex-sandbox-bin
          - dsh-codex-pack
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Test
        working-directory: ${{ matrix.package }}
        run: pnpm test

  typecheck:
    # Every package declares typescript 5.9.3 and a typecheck script, but no
    # job ever invoked them: type errors only surfaced when someone happened
    # to run tsc by hand (that is how the 33-item policy-engine backlog and
    # the schema drift were found). Run it per package like the test matrix.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - codex-config-importer
          - codex-edit-fusion
          - codex-net-guard
          - codex-policy-engine
          - codex-prompts
          - codex-schema
          - codex-session-kit
          - codex-skills-kit
          - codex-sandbox-bin
          - dsh-codex-pack
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Typecheck
        working-directory: ${{ matrix.package }}
        run: pnpm typecheck

  windows-shim:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify cmd.exe shim quoting
        run: node --test scripts/windows-cmd-invocation.test.mjs

  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify YAML and JSON ledger mirrors
        run: node dsh-codex-ledger/scripts/check_yaml_json_consistency.mjs

  bundles:
    # Guards the committed single-file bundles: every package ships lib/index.js
    # built from src, and it silently drifts whenever src changes without a
    # rebuild. Keep the exact tool version aligned with local package locks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install esbuild
        run: npm install -g esbuild@0.25.12
      - name: Verify committed bundles match src
        run: node scripts/rebuild-bundles.mjs --check
