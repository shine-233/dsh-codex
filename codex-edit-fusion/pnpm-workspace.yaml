allowBuilds:
  esbuild: true
  fs-ext: true
  koffi: true

# ---------------------------------------------------------------------------
# 本机开发覆盖（**不入库**）
#
# 下面的 overrides 把 @deepseek-ai/* 链接到本机 DSH 源码，路径是 Windows
# 绝对路径（C:/Users/Zz/...）。它们一旦提交，CI 的 Ubuntu runner 上无法解析，
# typecheck / test 会直接报 "Cannot find package '@deepseek-ai/*'"。
#
# 需要对本地 DSH 源码调试时：在本地临时取消注释，调试完**务必恢复提交**。
# 依赖版本请使用 npm 上已发布的 0.1.3-alpha.2（0.1.3-alpha.1 从未发布）。
#
# overrides:
#   '@deepseek-ai/cordis': 'link:<本机路径>/vendor/cordis'
#   '@deepseek-ai/cordis-plugin-include': 'link:<本机路径>/vendor/include'
#   '@deepseek-ai/cordis-plugin-loader': 'link:<本机路径>/vendor/loader'
#   '@deepseek-ai/cosmokit': 'link:<本机路径>/vendor/cosmokit'
#   '@deepseek-ai/schemastery': 'link:<本机路径>/vendor/schemastery'
#   '@deepseek-ai/dsh-agent': 'link:<本机路径>/packages/core/agent'
#   '@deepseek-ai/dsh-brand': 'link:<本机路径>/packages/util/brand'
#   '@deepseek-ai/dsh-code-runtime': 'link:<本机路径>/packages/code-runtime/code-runtime'
#   '@deepseek-ai/dsh-fs': 'link:<本机路径>/packages/fs/fs'
#   '@deepseek-ai/dsh-fs-local': 'link:<本机路径>/packages/fs/fs-local'
#   '@deepseek-ai/dsh-fs-sandbox': 'link:<本机路径>/packages/fs/fs-sandbox'
#   '@deepseek-ai/dsh-invariants': 'link:<本机路径>/packages/runtime-diagnostics/invariants'
#   '@deepseek-ai/dsh-llm': 'link:<本机路径>/packages/llm/llm'
#   '@deepseek-ai/dsh-sandbox': 'link:<本机路径>/packages/sandbox/sandbox'
#   '@deepseek-ai/dsh-sandbox-policy': 'link:<本机路径>/packages/sandbox/sandbox-policy'
#   '@deepseek-ai/dsh-scope': 'link:<本机路径>/packages/core/scope'
#   '@deepseek-ai/dsh-session': 'link:<本机路径>/packages/core/session'
#   '@deepseek-ai/dsh-session-projection': 'link:<本机路径>/packages/session/session-projection'
#   '@deepseek-ai/dsh-system-prompt': 'link:<本机路径>/packages/core/system-prompt'
#   '@deepseek-ai/dsh-tools': 'link:<本机路径>/packages/core/tools'
#   '@deepseek-ai/dsh-typert-protocol': 'link:<本机路径>/packages/typert/protocol'
#   '@deepseek-ai/dsh-user-approval': 'link:<本机路径>/packages/interaction/user-approval'
#   '@deepseek-ai/dsh-util-values': 'link:<本机路径>/packages/util/values'
# ---------------------------------------------------------------------------
