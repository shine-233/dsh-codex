approval_policy = "on-request"
history_max_bytes = 1048576
enabled_features = ["shell", "mcp", "web_search"]
release_date = 2026-09-07
instructions = """
Use the repository instructions.
Keep # markers inside multiline text.
Keep changes focused and explain verification.
